spring.application.name=superlingo

# ========== Supabase (PostgreSQL) 数据库连接 ==========
# 生产环境务必通过环境变量注入，切勿把密钥写死在代码里。
# Supabase 的「直连」主机（db.<ref>.supabase.co）只解析到 IPv6 地址，
# 在不支持 IPv6 的环境（多数云平台/本地网络）无法连接。
# 因此必须使用 Supavisor 连接池（IPv4），并在 HikariCP 下选择 session 模式（端口 5432）。
#   - session 模式（推荐，配合连接池）：jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
#   - transaction 模式（端口 6543）：不适合 HikariCP 这类长连接池
# 用户名格式为 postgres.<project-ref>，可在 Supabase 控制台 -> Project Settings -> Database 查看。
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres.ckjyhgkmovlrbgcfnsbw}
spring.datasource.password=${SUPABASE_DB_PASSWORD:446678850liu}
spring.datasource.driver-class-name=org.postgresql.Driver

# 连接池：启动时不要因数据库暂不可达而崩溃（关闭 fail-fast）
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5

# 服务配置
server.port=8081